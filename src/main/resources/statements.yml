# Configuration for the statements service. Named statements.yml (not application.yml) so several services can
# share one JVM host without their settings colliding.
spring:
  application:
    name: sprout-statements
  jackson:
    default-property-inclusion: non_null   # absent, never null: the contracts say so
    deserialization:
      fail-on-unknown-properties: true
  jmx:
    enabled: false

server:
  port: ${STATEMENTS_PORT:8113}
  address: ${STATEMENTS_BIND:127.0.0.1}
  tomcat:
    threads:
      max: 16

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: ${OTEL_ENABLED:false}
        url: ${OTEL_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 15s
    tracing:
      endpoint: ${OTEL_TRACES_URL:http://localhost:4318/v1/traces}
  tracing:
    enabled: ${OTEL_ENABLED:false}
    sampling:
      probability: 1.0
  metrics:
    tags:
      service: sprout-statements

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  pattern:
    correlation: "[%X{requestId:-}] "

sprout:
  statements:
    service-key: ${SPROUT_SERVICE_KEY:dev-only-service-key}
    broker-name: Sprout Investments (a simulation)
    broker-registration: "INZ000SPROUT0 (not a real registration)"
    oms:
      url: ${STATEMENTS_OMS_URL:http://127.0.0.1:8109}
    ledger:
      url: ${STATEMENTS_LEDGER_URL:http://127.0.0.1:8106}
    accounts:
      url: ${STATEMENTS_ACCOUNTS_URL:http://127.0.0.1:8104}
    depository:
      url: ${STATEMENTS_DEPOSITORY_URL:http://127.0.0.1:8111}
      participant-key: ${DEPOSITORY_SPROUT_PARTICIPANT_KEY:dev-only-participant-key}
